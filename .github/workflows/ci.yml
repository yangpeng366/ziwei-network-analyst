name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # 脚本路径纪律：代码里禁盘符硬编码；每个 .ps1 必须 dot-source scripts/lib/repo-paths.ps1
      # （唯一派生点：$RepoRoot / $EngineRoot。换机器/换盘符后再也不用手改脚本）
      - name: 脚本无绝对路径（禁盘符硬编码 + ps1 统一 dot-source repo-paths.ps1）
        run: python scripts/check-no-abs-paths.py
      # 负例自测：规则必须真会打红（正文/代码裸盘符）、放行口必须真放行（围栏/白名单），
      # 且白名单只按行、URL 双斜杠不误判。规则哪天被改成「永远 OK」，这步先红。
      - name: 路径纪律自测（负例打红 + 围栏/白名单放行）
        run: python scripts/check-no-abs-paths.py --selftest
      - name: F1 回归（高协作 > 样本 > 低协作）
        run: python scripts/test-f1-regression.py
      - name: fixture 转换可复现（两次一致 + 与基准件一致）
        run: python scripts/test-fixture-repro.py
      - name: Skill 可被显式调用（frontmatter + 路径无漂 + 入口命令）
        run: python scripts/test-skill-entry.py
      - name: 事项映射回归（问法语料 + 前后端一致）
        run: python scripts/test-matter-mapping.py
      - name: 问法兜底提示回归（general 必须自报「问法没被识别」，CLI 与站点同源）
        run: python scripts/test-matter-fallback.py
      # 速查表唯一真源是 catalog.json：scripts/gen-matter-lexicon.py 生成 docs/matter-lexicon.md，
      # 手改 md 或改了目录忘了重生，这一步都会打红（修法：重跑生成器）
      - name: 速查表未漂移（docs/matter-lexicon.md 由 catalog 生成，勿手改）
        run: python scripts/check-matter-lexicon.py
      - name: 端到端：问事 -> 提示包
        run: |
          python scripts/ask.py --demo --matter "今年适合跳槽吗"
          python scripts/ask.py --chart fixtures/sample-chart.json --matter "这段感情能长久吗" --print-only
      - name: 逐年推演（曲线 + 交接年）
        run: python scripts/sweep.py --chart fixtures/sample-chart.json --from 2020 --to 2032
      - name: 生成静态站数据
        run: python scripts/build_site.py
      - name: 静态站数据未漂移
        run: python scripts/check-site-drift.py
      - name: 白话与提示包冒烟
        run: python scripts/smoke.py
      - name: 提示词瘦身回归（星曜不重复 + 宽泛提问不铺满）
        run: python scripts/test-prompt-slim.py
      - name: 静态站结构自检（元素 id 齐备）
        run: python scripts/test-static-page.py
