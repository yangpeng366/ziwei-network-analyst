name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: F1 回归（高协作 > 样本 > 低协作）
        run: python scripts/test-f1-regression.py
      - name: fixture 转换可复现（两次一致 + 与基准件一致）
        run: python scripts/test-fixture-repro.py
      - name: Skill 可被显式调用（frontmatter + 路径无漂 + 入口命令）
        run: python scripts/test-skill-entry.py
      - name: 事项映射回归（问法语料 + 前后端一致）
        run: python scripts/test-matter-mapping.py
      - name: 端到端：问事 -> 提示包
        run: |
          python scripts/ask.py --demo --matter "今年适合跳槽吗"
          python scripts/ask.py --chart fixtures/sample-chart.json --matter "这段感情能长久吗" --print-only
      - name: 逐年推演（曲线 + 交接年）
        run: python scripts/sweep.py --chart fixtures/sample-chart.json --from 2020 --to 2032
      - name: 生成静态站数据
        run: python scripts/build_site.py
      - name: 静态站数据未漂移
        run: python scripts/check-site-drift.py
      - name: 白话与提示包冒烟
        run: python scripts/smoke.py
      - name: 提示词瘦身回归（星曜不重复 + 宽泛提问不铺满）
        run: python scripts/test-prompt-slim.py
      - name: 静态站结构自检（元素 id 齐备）
        run: python scripts/test-static-page.py
